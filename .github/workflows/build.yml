name: test, build and release Landing Rate Insights
# One run builds everything; every file is uploaded unzipped (archive: false), so the run's
# artifacts and the release assets are the binaries themselves.
#
# bundled  - PyInstaller, one self-contained file: Python, Qt/PySide6, pandas, numpy, matplotlib
#            inside. Nothing to install on the target machine.
#              LandingRateInsights-x.y.z-win64.exe, LandingRateInsights-x.y.z-linux64
# system   - executable zipapp with only this app's code; it uses the machine's own Python 3.10+,
#            PySide6/Qt, pandas, numpy and matplotlib:
#              Arch:        pacman -S pyside6 qt6-svg python-pandas python-matplotlib
#              Debian 13+:  apt install python3-pyside6.qtwidgets python3-pyside6.qtsvg python3-pandas python3-matplotlib
#              Windows:     pip install -r requirements.txt, then: py LandingRateInsights-x.y.z-win-system.pyz
#              LandingRateInsights-x.y.z-linux-system (chmod +x and run), LandingRateInsights-x.y.z-win-system.pyz
on:
  push:
    branches:
      - main
      - ci
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: "x86_64_linux"
          - os: windows-2022
            name: "x86_64_windows"
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: fix crlf
        run: git config --global core.autocrlf input

      - name: checkout
        uses: actions/checkout@v4

      - name: linux libraries Qt needs
        if: matrix.name == 'x86_64_linux'
        run: |
          sudo apt-get update
          sudo apt-get -y install libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: lint
        run: python -m pyflakes landingrate tests tools run_insights.py

      - name: pytest
        run: python -m pytest -q

  build-bundled:
    needs: test
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-2022
            name: "x86_64_windows"
            pyi_name: "win64"
          # oldest supported runner = oldest glibc, so the binary also runs on older distros
          - os: ubuntu-22.04
            name: "x86_64_linux"
            pyi_name: "linux64"
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: fix crlf
        run: git config --global core.autocrlf input

      - name: checkout
        uses: actions/checkout@v4

      - name: linux libraries Qt needs
        if: matrix.name == 'x86_64_linux'
        run: |
          sudo apt-get update
          sudo apt-get -y install libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3

      - name: python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: ${{ matrix.name }} venv
        run: |
          python -m venv .venv
          if [ -x .venv/Scripts/python.exe ]; then PY=.venv/Scripts/python.exe; else PY=.venv/bin/python; fi
          echo "PY=$PY" >> "$GITHUB_ENV"
          $PY -m pip install --upgrade pip
          $PY -m pip install -r requirements-dev.txt

      - name: stamp version from tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VER="${GITHUB_REF_NAME#v}"
          sed -i "s/^__version__ = .*/__version__ = \"${VER}\"/" landingrate/__init__.py
          grep __version__ landingrate/__init__.py

      - name: build
        run: |
          $PY -m PyInstaller --noconfirm LandingRateInsights.spec
          VER=$($PY -c 'from landingrate import __version__; print(__version__)')
          if [ "${{ matrix.name }}" = "x86_64_windows" ]; then
            OUT="LandingRateInsights-${VER}-${{ matrix.pyi_name }}.exe"; mv dist/LandingRateInsights.exe "$OUT"
          else
            OUT="LandingRateInsights-${VER}-${{ matrix.pyi_name }}"; mv dist/LandingRateInsights "$OUT"; chmod +x "$OUT"
          fi
          ls -l "$OUT"
          echo "OUT=$OUT" >> "$GITHUB_ENV"

      - name: smoke test the build
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          # windowed exe: no console output on Windows, so the exit code is the result
          "./$OUT" --self-test

      - name: ${{ matrix.name }} upload
        uses: actions/upload-artifact@v7
        with:
          path: ${{ env.OUT }}
          archive: false
          if-no-files-found: error

  build-system:
    needs: test
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-24.04
            name: "x86_64_linux"
            suffix: "linux-system"
          - os: windows-2022
            name: "x86_64_windows"
            suffix: "win-system.pyz"
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: fix crlf
        run: git config --global core.autocrlf input

      - name: checkout
        uses: actions/checkout@v4

      - name: python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: stamp version from tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VER="${GITHUB_REF_NAME#v}"
          sed -i "s/^__version__ = .*/__version__ = \"${VER}\"/" landingrate/__init__.py
          grep __version__ landingrate/__init__.py

      - name: build
        run: |
          VER=$(python -c 'from landingrate import __version__; print(__version__)')
          OUT="LandingRateInsights-${VER}-${{ matrix.suffix }}"
          python tools/build_pyz.py -o "$OUT"
          echo "OUT=$OUT" >> "$GITHUB_ENV"

      # Linux is tested against real distro packages in test-system; Windows has no system
      # PySide6, so it gets the pip-installed libraries the .pyz would use there.
      - name: smoke test with pip-installed libraries
        if: matrix.name == 'x86_64_windows'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pip install -r requirements.txt
          python "$OUT" --version
          python "$OUT" --self-test

      - name: ${{ matrix.name }} upload
        uses: actions/upload-artifact@v7
        with:
          path: ${{ env.OUT }}
          archive: false
          if-no-files-found: error

  # Run the Linux system build against each distro's own packaged Qt/PySide6 - no pip, no bundled libs.
  test-system:
    needs: build-system
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: arch
            image: archlinux:latest
            install: pacman -Syu --noconfirm python pyside6 qt6-svg python-pandas python-numpy python-matplotlib python-pytest
          - name: debian-13
            image: debian:trixie
            install: >-
              apt-get update && apt-get -y install python3 python3-pyside6.qtwidgets python3-pyside6.qtsvg
              python3-pandas python3-numpy python3-matplotlib python3-pytest
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: system packages
        run: ${{ matrix.install }}

      - name: checkout
        uses: actions/checkout@v4

      - name: download the linux system build
        uses: actions/download-artifact@v8
        with:
          pattern: "*-linux-system"
          path: dist
          merge-multiple: true

      - name: pytest against system libs
        run: python3 -m pytest -q

      - name: smoke test the system build
        run: |
          OUT=$(find dist -type f -name '*-linux-system' | head -n 1)
          chmod +x "$OUT"
          "$OUT" --version
          "$OUT" --self-test

  release:
    needs: [build-bundled, test-system]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: download every build
        uses: actions/download-artifact@v8
        with:
          pattern: "LandingRateInsights-*"
          path: dist
          merge-multiple: true

      - name: list
        run: find dist -type f -exec ls -l {} +

      - name: attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/LandingRateInsights-*
          fail_on_unmatched_files: true
