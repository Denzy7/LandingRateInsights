name: system-libs build (uses installed python, qt and pyside6)
# A single small executable zipapp (.pyz) containing only this app's code. It runs on the
# machine's own Python and imports the PySide6/Qt, pandas, numpy and matplotlib installed there:
#   Arch:            pacman -S pyside6 python-pandas python-matplotlib
#   Debian 13+:      apt install python3-pyside6.qtwidgets python3-pyside6.qtsvg python3-pandas python3-matplotlib
#   Windows / other: pip install -r requirements.txt, then: py LandingRateInsights-x.y.z.pyz
on:
  push:
    branches:
      - main
      - ci
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: lint
        run: |
          python -m pip install pyflakes
          python -m pyflakes landingrate tests tools run_insights.py

      - name: stamp version from tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VER="${GITHUB_REF_NAME#v}"
          sed -i "s/^__version__ = .*/__version__ = \"${VER}\"/" landingrate/__init__.py
          grep __version__ landingrate/__init__.py

      - name: build
        run: |
          VER=$(python -c 'from landingrate import __version__; print(__version__)')
          OUT="LandingRateInsights-${VER}-system.pyz"
          python tools/build_pyz.py -o "$OUT"
          echo "OUT=$OUT" >> "$GITHUB_ENV"

      - name: upload
        uses: actions/upload-artifact@v4
        with:
          name: system-pyz
          path: ${{ env.OUT }}
          if-no-files-found: error

  # Run the .pyz against each distro's own packaged Qt/PySide6 - no pip, no bundled libs.
  test-on-distro:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: arch
            image: archlinux:latest
            install: pacman -Syu --noconfirm python pyside6 python-pandas python-numpy python-matplotlib python-pytest
          - name: debian-13
            image: debian:trixie
            install: >-
              apt-get update && apt-get -y install python3 python3-pyside6.qtwidgets python3-pyside6.qtsvg
              python3-pandas python3-numpy python3-matplotlib python3-pytest
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: system packages
        run: ${{ matrix.install }}

      - name: checkout
        uses: actions/checkout@v4

      - name: download build
        uses: actions/download-artifact@v4
        with:
          name: system-pyz
          path: dist

      - name: pytest against system libs
        run: python3 -m pytest -q

      - name: smoke test the .pyz
        run: |
          OUT=$(ls dist/*.pyz)
          chmod +x "$OUT"
          "$OUT" --version
          "$OUT" --self-test

  release:
    needs: test-on-distro
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: download build
        uses: actions/download-artifact@v4
        with:
          name: system-pyz
          path: dist

      - name: attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.pyz
