name: bundled build (all libs inside) for windows and linux
# One self-contained file per OS: Python, Qt/PySide6, pandas, numpy and matplotlib are all
# packed in by PyInstaller, so nothing needs to be installed on the target machine.
on:
  push:
    branches:
      - main
      - ci
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: "x86_64_linux"
          - os: windows-2022
            name: "x86_64_windows"
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: fix crlf
        run: git config --global core.autocrlf input

      - name: checkout
        uses: actions/checkout@v4

      - name: linux libraries Qt needs
        if: matrix.name == 'x86_64_linux'
        run: |
          sudo apt-get update
          sudo apt-get -y install libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: lint
        run: python -m pyflakes landingrate tests tools run_insights.py

      - name: pytest
        run: python -m pytest -q

  build:
    needs: test
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-2022
            name: "x86_64_windows"
            pyi_name: "win64"
          # oldest supported runner = oldest glibc, so the binary also runs on older distros
          - os: ubuntu-22.04
            name: "x86_64_linux"
            pyi_name: "linux64"
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    defaults:
      run:
        shell: bash

    steps:
      - name: fix crlf
        run: git config --global core.autocrlf input

      - name: checkout
        uses: actions/checkout@v4

      - name: linux libraries Qt needs
        if: matrix.name == 'x86_64_linux'
        run: |
          sudo apt-get update
          sudo apt-get -y install libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3

      - name: python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: ${{ matrix.name }} venv
        run: |
          python -m venv .venv
          if [ -x .venv/Scripts/python.exe ]; then PY=.venv/Scripts/python.exe; else PY=.venv/bin/python; fi
          echo "PY=$PY" >> "$GITHUB_ENV"
          $PY -m pip install --upgrade pip
          $PY -m pip install -r requirements-dev.txt

      - name: stamp version from tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VER="${GITHUB_REF_NAME#v}"
          sed -i "s/^__version__ = .*/__version__ = \"${VER}\"/" landingrate/__init__.py
          grep __version__ landingrate/__init__.py

      - name: build
        run: |
          $PY -m PyInstaller --noconfirm LandingRateInsights.spec
          VER=$($PY -c 'from landingrate import __version__; print(__version__)')
          if [ "${{ matrix.name }}" = "x86_64_windows" ]; then
            OUT="LandingRateInsights-${VER}-${{ matrix.pyi_name }}.exe"; mv dist/LandingRateInsights.exe "$OUT"
          else
            OUT="LandingRateInsights-${VER}-${{ matrix.pyi_name }}"; mv dist/LandingRateInsights "$OUT"; chmod +x "$OUT"
          fi
          ls -l "$OUT"
          echo "OUT=$OUT" >> "$GITHUB_ENV"

      - name: smoke test the build
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          # windowed exe: no console output on Windows, so the exit code is the result
          "./$OUT" --self-test

      - name: ${{ matrix.name }} upload
        uses: actions/upload-artifact@v7
        with:
          path: ${{ env.OUT }}
          archive: false
          if-no-files-found: error

      - name: attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.OUT }}
